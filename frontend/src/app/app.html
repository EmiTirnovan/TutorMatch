<header class="app-header">
  <div class="header-container">
    <div class="brand">
      <a routerLink="/" class="logo">
        <svg class="logo-svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
          <path d="M6 12v5c3 3 9 3 12 0v-5"/>
        </svg>
        <span class="logo-text">TutorMatch</span>
      </a>
      <span class="badge badge-primary header-badge">University Peer Tutoring</span>
    </div>

    <nav class="nav-links">
      <a routerLink="/tutors/search" routerLinkActive="active" class="nav-item">
        Discover tutors
      </a>
      <a routerLink="/tutors/register" routerLinkActive="active" class="nav-item">
        Become a Tutor
      </a>
      @if (myTutorId(); as tid) {
        <a [routerLink]="['/tutors', tid]" routerLinkActive="active" class="nav-item">
          My Profile
        </a>
      } @else {
        <a routerLink="/tutors/demo" routerLinkActive="active" class="nav-item">
          Demo Profile
        </a>
      }
    </nav>

    <div class="user-control">
      <span class="admin-badge">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-right: 0.35rem; vertical-align: -2px;">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
        Admin / Test Mode
      </span>
    </div>
  </div>
</header>

<main class="main-content">
  <router-outlet></router-outlet>
</main>
