<header class="app-header">
  <div class="header-container">
    <div class="brand">
      <a routerLink="/" class="logo">
        <svg class="logo-svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
          <path d="M6 12v5c3 3 9 3 12 0v-5"/>
        </svg>
        <span class="logo-text">TutorMatch</span>
      </a>
      <span class="badge badge-primary header-badge">University Peer Tutoring</span>
    </div>

    <nav class="nav-links">
      @if (userRole() === 'student') {
        <a routerLink="/tutors/search" routerLinkActive="active" class="nav-item">
          Discover tutors
        </a>
        <a routerLink="/sessions" routerLinkActive="active" class="nav-item">
          My Sessions
        </a>
        <a routerLink="/tutors/register" routerLinkActive="active" class="nav-item">
          Become a Tutor
        </a>
      } @else {
        <a routerLink="/sessions" routerLinkActive="active" class="nav-item">
          My Sessions
        </a>
        <a [routerLink]="['/tutors', tutorId()]" routerLinkActive="active" class="nav-item">
          My Profile
        </a>
        <a [routerLink]="['/tutors', tutorId(), 'availability']" routerLinkActive="active" class="nav-item">
          Manage Availability
        </a>
      }
    </nav>

    <div class="user-control">
      <div class="role-identity">
        <span class="role-indicator">
          Mode: <strong>{{ userRole() === 'tutor' ? 'Tutor View' : 'Student View' }}</strong>
        </span>
        <span class="user-name">
          ({{ activeUserName() }})
        </span>
      </div>
      <button type="button" class="btn btn-secondary btn-sm" (click)="toggleRole()" data-testid="header-toggle-role-btn">
        Switch to {{ userRole() === 'tutor' ? 'Student' : 'Tutor' }}
      </button>
    </div>
  </div>
</header>

<main class="main-content">
  <router-outlet></router-outlet>
</main>
